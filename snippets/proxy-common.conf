limit_conn per_ip 3;    # max 3 concurrent connections per IP
# limit_rate 10K;      # 500k per connection
# proxy_limit_rate 500k;


# ── Secure Link (staging only) ────────────────────────────────────────────
secure_link $arg_token,$arg_e;

set $secretKey "a9f3c7d1e8b5f2k4m6n8p1q3r5s7t9v2";
secure_link_md5 "$secure_link_expires$secure_base_path $arg_upid $secretKey";

if ($secure_link = "") {
    return 403;
}

if ($secure_link = "0") {
    return 410;
}
# ── End Secure Link ───────────────────────────────────────────────────────


# proxy_pass https://83.149.92.247;        
# resolver 8.8.8.8 ipv6=off;
# set $upstream "shieldedstar.com";
# proxy_pass https://$upstream;


# proxy_set_header Host shieldedstar.com;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Range $http_range;
proxy_set_header If-Range $http_if_range;

# proxy_ssl_server_name on;
# proxy_ssl_verify off;

# Remove any existing CORS headers from upstream
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;


# set $cors "";
# if ($http_origin ~* "^https?://([a-z0-9-]+\.)?watchflx\.com$") {
#    set $cors $http_origin;
# }

add_header Access-Control-Allow-Origin "$allowed_cors_domain" always;
# add_header Access-Control-Allow-Origin $cors always;
add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
add_header Access-Control-Allow-Headers "*" always;


proxy_pass https://83.149.92.247;

# CORS headers
# add_header Access-Control-Allow-Origin *;
# add_header Access-Control-Allow-Methods "GET, OPTIONS";
# add_header Access-Control-Allow-Headers "*";

# Adding token into index.m3u8 and ts files
sub_filter_types application/vnd.apple.mpegurl;
sub_filter_once off;
sub_filter '.m3u8' '.m3u8?$args';
sub_filter '.ts'   '.ts?$args';



